# Schemata on Netlify: a static Next.js export (out/). Postgres runs in the browser (PGlite),
# so there is no backend. The optional Studia account (GitHub sign-in and progress sync through
# Supabase) needs NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY;
# NEXT_PUBLIC_STUDIA_URL and NEXT_PUBLIC_REQUIRE_SIGN_IN=true put it behind the Studia login.
# See the README, "Studia account".
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Older links put everything in the query string. DSA Atlas and Structura build these
# (docs/ecosystem.md), so they keep working: each moves to the page's own address.
[[redirects]]
  from = "/"
  query = { topic = ":id" }
  to = "/topics/:id"
  status = 301
  force = true

[[redirects]]
  from = "/"
  query = { q = ":id" }
  to = "/questions/:id"
  status = 301
  force = true

[[redirects]]
  from = "/"
  query = { page = "playground", dataset = ":dataset" }
  to = "/playground?dataset=:dataset"
  status = 301
  force = true

[[redirects]]
  from = "/"
  query = { page = "playground" }
  to = "/playground"
  status = 301
  force = true

[[redirects]]
  from = "/"
  query = { page = "questions", stage = ":stage" }
  to = "/questions?stage=:stage"
  status = 301
  force = true

[[redirects]]
  from = "/"
  query = { page = "questions" }
  to = "/questions"
  status = 301
  force = true

[[redirects]]
  from = "/"
  query = { page = "roadmap" }
  to = "/roadmap"
  status = 301
  force = true

[[redirects]]
  from = "/"
  query = { page = "databases" }
  to = "/databases"
  status = 301
  force = true

[[redirects]]
  from = "/"
  query = { page = "sources" }
  to = "/sources"
  status = 301
  force = true

# DSA Atlas and Structura read this list to link to Schemata topics.
[[headers]]
  for = "/topics.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pglite/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# llms.txt and the Markdown copy of each lesson (/md/<id>.md, kept out of search results),
# for AI assistants (src/content/llms.ts).
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/md/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Content-Type = "text/markdown; charset=utf-8"
